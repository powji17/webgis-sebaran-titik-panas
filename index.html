<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebaran Titik Panas — Kalimantan Barat</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">

  <!-- Sidebar Toggle Button -->
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Buka panel kontrol" title="Panel Kontrol">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Floating Sidebar Panel -->
  <aside id="sidebar" class="floating-sidebar">
    <header class="sidebar-head">
      <div class="sidebar-head-top">
        <div class="sidebar-brand">
          <span class="sidebar-brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
          </span>
          <span class="sidebar-brand-label">WebGIS Hotspot</span>
        </div>
        <button id="sidebar-close" class="sidebar-close" aria-label="Tutup panel" title="Tutup">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="sidebar-head-body">
        <h1>Sebaran Titik Panas</h1>
        <p class="subtitle">Provinsi Kalimantan Barat</p>
      </div>
      <p class="periode" id="periode-label">Memuat periode data&hellip;</p>
    </header>

    <section class="panel" id="panel-tanggal">
      <h2>Rentang tanggal</h2>
      <div class="date-row">
        <label>
          <span>Dari</span>
          <input type="date" id="tanggal-mulai">
        </label>
        <label>
          <span>Sampai</span>
          <input type="date" id="tanggal-selesai">
        </label>
      </div>
    </section>

    <section class="panel" id="panel-statistik">
      <h2>Statistik</h2>
      <div class="stat-row">
        <div class="stat-card" id="stat-points">
          <span class="stat-card-label">Titik Ditampilkan</span>
          <span class="stat-card-value" id="stat-total">0</span>
        </div>
        <div class="stat-card" id="stat-regions">
          <span class="stat-card-label">Wilayah aktif</span>
          <span class="stat-card-value" id="stat-wilayah">0/14</span>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-wilayah">
      <div class="panel-head-row">
        <h2>Kabupaten / Kota</h2>
        <button id="btn-clear" class="link-btn" type="button">Kosongkan</button>
      </div>
      <ul id="daftar-wilayah" class="wilayah-list">
        <!-- diisi lewat JS -->
      </ul>
    </section>

    <section class="panel" id="panel-layer-control">
      <h2>Kontrol Layer</h2>
      <div class="layer-control-list">
        <label class="layer-checkbox-option">
          <input type="checkbox" id="toggle-hotspot" checked>
          <span>Titik Panas (Hotspot)</span>
        </label>
        <label class="layer-checkbox-option">
          <input type="checkbox" id="toggle-boundary" checked>
          <span>Batas Daerah</span>
        </label>
        <label class="layer-checkbox-option">
          <input type="checkbox" id="toggle-label" checked>
          <span>Label Nama Daerah</span>
        </label>
      </div>
    </section>
  </aside>

  <!-- Sidebar backdrop for mobile -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <main id="peta">
    <!-- Floating Card for Most Hotspot Area -->
    <div id="alert-card" class="floating-card">
      <div class="card-header">Wilayah dengan Titik Terbanyak</div>
      <div class="card-body" id="alert-content">-</div>
    </div>
    <div id="map-controls" class="map-controls">
      <div class="basemap-row">
        <label class="basemap-option">
          <input type="radio" name="basemap" value="Satelit" checked>
          <span>Satelit</span>
        </label>
        <label class="basemap-option">
          <input type="radio" name="basemap" value="OSM">
          <span>OSM</span>
        </label>
      </div>
    </div>

    <div id="map-legend" class="map-legend">
      <div class="legend-header">Tingkat Keyakinan</div>
      <div class="legend-row">
        <span class="legend-item"><span class="dot dot-high"></span> Tinggi</span>
        <span class="legend-item"><span class="dot dot-medium"></span> Sedang</span>
        <span class="legend-item"><span class="dot dot-low"></span> Rendah</span>
      </div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
