<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebaran Titik Panas — Kalimantan Barat</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <header class="sidebar-head">
      <h1>Sebaran Titik Panas</h1>
      <p class="subtitle">Provinsi Kalimantan Barat</p>
      <p class="periode" id="periode-label">Memuat periode data&hellip;</p>
    </header>

    <section class="panel" id="panel-tanggal">
      <h2>Rentang tanggal</h2>
      <div class="date-row">
        <label>
          <span>Dari</span>
          <input type="date" id="tanggal-mulai">
        </label>
        <label>
          <span>Sampai</span>
          <input type="date" id="tanggal-selesai">
        </label>
      </div>
    </section>

    <section class="panel" id="panel-wilayah">
      <div class="panel-head-row">
        <h2>Kabupaten / Kota</h2>
        <button id="btn-clear" class="link-btn" type="button">Kosongkan</button>
      </div>
      <ul id="daftar-wilayah" class="wilayah-list">
        <!-- diisi lewat JS -->
      </ul>
    </section>

    <section class="panel" id="panel-legenda">
      <h2>Tingkat keyakinan</h2>
      <ul class="legenda-list">
        <li><span class="dot dot-high"></span> High</li>
        <li><span class="dot dot-medium"></span> Medium</li>
        <li><span class="dot dot-low"></span> Low</li>
      </ul>
    </section>

    <section class="panel" id="panel-basemap">
      <h2>Basemap</h2>
      <div class="basemap-row">
        <label class="basemap-option">
          <input type="radio" name="basemap" value="Satelit" checked>
          <span>Satelit</span>
        </label>
        <label class="basemap-option">
          <input type="radio" name="basemap" value="OSM">
          <span>OSM</span>
        </label>
      </div>
    </section>

    <footer class="sidebar-foot">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">titik ditampilkan</span>
      </div>
    </footer>
  </aside>

  <main id="peta"></main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
